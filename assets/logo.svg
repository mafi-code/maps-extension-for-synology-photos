<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Kartenansicht für Synology Photos – Logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0720"/>
      <stop offset="0.58" stop-color="#170b38"/>
      <stop offset="1" stop-color="#080515"/>
    </linearGradient>
    <radialGradient id="horizon" cx="64" cy="76" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2fb0" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#7b2cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7b2cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2fb0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2fb0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff2fb0" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="tile"><rect x="4" y="4" width="120" height="120" rx="26"/></clipPath>
    <clipPath id="floor"><rect x="0" y="76" width="128" height="52"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <rect x="0" y="10" width="128" height="118" fill="url(#horizon)"/>

    <!-- synthwave map floor -->
    <g clip-path="url(#floor)" fill="none" stroke="url(#gridFade)" stroke-width="1.3">
      <path d="M0 80H128M0 86H128M0 94H128M0 105H128M0 119H128"/>
      <path d="M64 76L-72 128M64 76L-28 128M64 76L16 128M64 76L64 128M64 76L112 128M64 76L156 128M64 76L200 128"/>
    </g>
    <path d="M4 76H124" stroke="#ff2fb0" stroke-width="1.6" filter="url(#glow)"/>
  </g>

  <!-- light pool under the pin -->
  <ellipse cx="64" cy="99" rx="20" ry="4" fill="#00e5ff" opacity="0.6" filter="url(#haze)"/>

  <!-- neon pin -->
  <path d="M64 98C57 87 38 69 38 47A26 26 0 1 1 90 47C90 69 71 87 64 98Z"
        fill="#0d0a26" stroke="#00e5ff" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- photo inside the pin -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="50" y="35" width="28" height="22" rx="4" stroke="#ff2fb0" stroke-width="3"/>
    <path d="M53.5 53.5L60 45.5L65 50.5L69 46.5L74.5 53.5" stroke="#ff2fb0" stroke-width="2.6"/>
    <circle cx="70" cy="41" r="2.4" fill="#00e5ff" stroke="none"/>
  </g>

  <!-- neon edge -->
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="url(#edge)" stroke-width="2" opacity="0.85"/>
</svg>
