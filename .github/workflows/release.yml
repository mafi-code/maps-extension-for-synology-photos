name: Release

# Pushing a version tag (e.g. v0.3.1) builds the extension zip, creates the
# GitHub release with generated notes and attaches the zip. The tag must match
# "version" in manifest.json, otherwise the build fails.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload the zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build extension zip
        run: node tools/package.mjs --expect-version "${GITHUB_REF_NAME#v}"

      - name: Create release and upload zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
